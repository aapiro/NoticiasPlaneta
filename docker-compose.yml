services:
  db:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_DB: noticias
      POSTGRES_USER: noticias
      POSTGRES_PASSWORD: ${DB_PASSWORD:-noticias}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticias -d noticias"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/noticias
      DB_USER: noticias
      DB_PASSWORD: ${DB_PASSWORD:-noticias}
      AGENT_API_KEY: ${AGENT_API_KEY:-clave-de-desarrollo}
      AGENT_ID: ${AGENT_ID:-newsroom-agent}
      RP_ID: ${RP_ID:-localhost}
      RP_ORIGIN: ${RP_ORIGIN:-https://localhost}
      MEDIA_ROOT: /data/media
      OLLAMA_URL: http://ollama:11434
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media-data:/data/media
    restart: unless-stopped
    expose:
      - "8080"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
  ollama-data:
  media-data:
  caddy-data:
  caddy-config:
