services:
  db:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_DB: noticias
      POSTGRES_USER: noticias
      POSTGRES_PASSWORD: ${DB_PASSWORD:-noticias}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticias -d noticias"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/noticias
      DB_USER: noticias
      DB_PASSWORD: ${DB_PASSWORD:-noticias}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
