spring:
  application:
    name: noticiasplaneta
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noticias}
    username: ${DB_USER:noticias}
    password: ${DB_PASSWORD:noticias}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: noticiasplaneta
        version: 0.1.0
        protocol: STREAMABLE
        capabilities:
          tool: true
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}

management:
  endpoints:
    web:
      exposure:
        include: health,info

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    totp-secret: ${ADMIN_TOTP_SECRET:}

# Capacidades de IA activables (ADR-011). Todas apagadas por defecto: el sistema
# funciona sin IA y se enciende por capacidad. En F1 manda la tabla feature_flag.
features:
  ai:
    capabilities:
      SEARCH_SEMANTIC: ${AI_SEARCH_SEMANTIC:OFF}
      ENRICH_TAGS: ${AI_ENRICH_TAGS:OFF}
      ENRICH_ENTITIES: ${AI_ENRICH_ENTITIES:OFF}
      ENRICH_SUMMARY: ${AI_ENRICH_SUMMARY:OFF}
      ARTICLE_RELATED: ${AI_ARTICLE_RELATED:OFF}
      PUBLISH_AUTO: ${AI_PUBLISH_AUTO:OFF}

security:
  api-key: ${AGENT_API_KEY:}
  agent-id: ${AGENT_ID:newsroom-agent}
  rp-id: ${RP_ID:localhost}
  rp-name: Noticias Planeta
  allowed-origins:
    - ${RP_ORIGIN:https://localhost}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    # Endpoint configurable: cualquier API compatible con OpenAI sirve (incluido un
    # modelo autoalojado). Lo usa la clasificación de F6.
    endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}
  budget:
    daily-micros: ${AI_DAILY_BUDGET_MICROS:5000000}
  worker:
    delay-ms: 30000

langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  host: ${LANGFUSE_BASE_URL:${LANGFUSE_HOST:https://cloud.langfuse.com}}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  sample-rate: ${LANGFUSE_SAMPLE_RATE:1.0}
  service-name: ${LANGFUSE_SERVICE_NAME:noticiasplaneta}
  environment: ${LANGFUSE_ENVIRONMENT:production}
  max-payload-chars: ${LANGFUSE_MAX_PAYLOAD_CHARS:30000}

ingest:
  scheduler:
    enabled: true
    delay-ms: 900000

publish:
  scheduler:
    delay-ms: 30000

outbox:
  relay:
    delay-ms: 10000

news:
  default-section: general

# F6 · publicación automática. La pasada clasifica y publica; el interruptor de verdad
# está en la tabla de capacidades (PUBLISH_AUTO) y en section_config.auto_publica.
autopublish:
  scheduler:
    enabled: ${AUTOPUBLISH_SCHEDULER:true}
    delay-ms: ${AUTOPUBLISH_DELAY_MS:300000}
    initial-delay-ms: 45000
  batch-size: ${AUTOPUBLISH_BATCH:10}

# F7 · reglas de la edición que lanza el panel. Los mismos valores que
# scripts/edicion-diaria.sh (EDICION_VENTANA_HORAS, EDICION_LIMITE, EDICION_MAX_POR_FUENTE).
edicion:
  ventana-horas: ${EDICION_VENTANA_HORAS:48}
  limite: ${EDICION_LIMITE:20}
  max-por-fuente: ${EDICION_MAX_POR_FUENTE:3}
