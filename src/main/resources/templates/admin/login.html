<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: page('Acceso — Panel', ~{::main})}">
<body>
<main>
    <h1>Acceso al panel</h1>

    <p class="error" th:if="${error != null}" th:text="${error}">Error</p>

    <form th:action="@{/admin/login}" method="post">
        <div class="campo">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="campo">
            <label for="totp">Código de verificación (6 dígitos)</label>
            <input id="totp" type="text" name="totp" inputmode="numeric" pattern="[0-9]{6}"
                   autocomplete="one-time-code" maxlength="6" required>
        </div>
        <button type="submit">Entrar</button>
    </form>

    <p class="meta" style="margin-top:1.5rem">
        El panel está en transición a passkeys. Mientras tanto exige contraseña y segundo factor;
        no debe exponerse a Internet (ADR-010).
    </p>
</main>
</body>
</html>
