<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(${articulo.title()}, ~{::main})}">
<body>
<main>
    <div class="cuerpo-articulo">
        <span class="chip vivo" th:text="${articulo.sectionId()}">seccion</span>
        <span class="chip" th:if="${articulo.automatica()}"
              title="Clasificada y publicada por el sistema a partir de una fuente de confianza">
            Publicación automática
        </span>

        <h1 th:text="${articulo.title()}">Titular</h1>

        <p class="meta">
            <time th:if="${articulo.publishedAt() != null}" th:datetime="${articulo.publishedAt()}"
                  th:text="${articulo.publishedLabel()}">fecha</time>
            <span th:if="${fuentes != null and fuentes.independentSourceCount() > 0}">
                <span th:text="${fuentes.independentSourceCount()}">0</span> fuentes contrastadas
                · <span th:text="${fuentes.contrastLevel()}">LOW</span>
            </span>
        </p>

        <p class="correccion" th:if="${articulo.summary() != null}" th:text="${articulo.summary()}">Corrección</p>

        <figure class="foto" th:if="${articulo.imageUrl() != null and #lists.isEmpty(medios)}">
            <img th:src="${articulo.imageUrl()}" th:alt="${articulo.title()}" loading="eager">
        </figure>

        <figure th:each="m : ${medios}" th:if="${m.role() == 'LEAD'}" class="foto">
            <img th:src="@{'/media/' + ${#strings.substringAfter(m.storageKey(), 'media/')}}"
                 th:alt="${m.altText()}" th:width="${m.width()}" th:height="${m.height()}">
            <figcaption>
                <span th:text="${m.caption() ?: m.altText()}">Pie de foto</span>
                <span th:if="${m.credit() != null}" th:text="' · Foto: ' + ${m.credit()}"></span>
            </figcaption>
        </figure>

        <p class="entradilla" th:text="${texto.body()}">Texto</p>
    </div>
</main>
</body>
</html>
