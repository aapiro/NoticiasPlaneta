<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(${seccion} != null ? ${seccion} + ' — Noticias Planeta' : 'Portada — Noticias Planeta', ~{::main})}">
<body>
<main th:with="principal=${#lists.isEmpty(articulos) ? null : articulos[0]}">

    <p class="vacio" th:if="${principal == null}">Todavía no hay artículos publicados.</p>

    <!-- Apertura: la noticia mas reciente. La foto subida a mano manda sobre la del feed. -->
    <section class="hero" th:if="${principal != null}">
        <a class="hero-media"
           th:if="${medios.get(principal.id()) != null or principal.imageUrl() != null}"
           th:href="@{'/' + ${principal.sectionId()} + '/' + ${principal.slug()}}">
            <img class="miniatura"
                 th:src="${medios.get(principal.id()) != null
                            ? '/media/' + #strings.substringAfter(medios.get(principal.id()).storageKey(), 'media/')
                            : principal.imageUrl()}"
                 th:alt="${medios.get(principal.id()) != null
                            ? medios.get(principal.id()).altText()
                            : principal.title()}"
                 loading="eager">
        </a>

        <div class="hero-texto">
            <span class="chip vivo" th:text="${principal.sectionId()}">seccion</span>
            <h1>
                <a th:href="@{'/' + ${principal.sectionId()} + '/' + ${principal.slug()}}"
                   th:text="${principal.title()}">Titular</a>
            </h1>
            <p class="destacado" th:if="${principal.summary() != null}" th:text="${principal.summary()}"></p>
            <p class="meta">
                <time th:if="${principal.publishedAt() != null}" th:datetime="${principal.publishedAt()}"
                      th:text="${principal.publishedLabel()}">fecha</time>
            </p>
        </div>
    </section>

    <!-- Resto de la portada, en tarjetas -->
    <div class="rejilla">
        <article class="tarjeta" th:each="a, i : ${articulos}" th:if="${i.index > 0}">
            <a th:href="@{'/' + ${a.sectionId()} + '/' + ${a.slug()}}"
               th:if="${medios.get(a.id()) != null or a.imageUrl() != null}">
                <img class="miniatura"
                     th:src="${medios.get(a.id()) != null
                                ? '/media/' + #strings.substringAfter(medios.get(a.id()).storageKey(), 'media/')
                                : a.imageUrl()}"
                     th:alt="${medios.get(a.id()) != null ? medios.get(a.id()).altText() : a.title()}"
                     loading="lazy">
            </a>
            <div class="cuerpo">
                <span class="chip" th:text="${a.sectionId()}">seccion</span>
                <h2>
                    <a th:href="@{'/' + ${a.sectionId()} + '/' + ${a.slug()}}"
                       th:text="${a.title()}">Titular</a>
                </h2>
                <p class="meta">
                    <time th:if="${a.publishedAt() != null}" th:datetime="${a.publishedAt()}"
                          th:text="${a.publishedLabel()}">fecha</time>
                </p>
            </div>
        </article>
    </div>

    <nav th:replace="~{layout :: paginacion('/')}"></nav>

</main>
</body>
</html>
