<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="page(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Panel — Noticias Planeta</title>
    <style>
        :root { color-scheme: light dark; --tinta:#111; --papel:#fff; --tenue:#666; --linea:#ddd;
                --acento:#1d4ed8; --aviso:#b45309; }
        @media (prefers-color-scheme: dark) {
            :root { --tinta:#e9edf5; --papel:#0f1218; --tenue:#98a2b3; --linea:#242b36; --acento:#7aa2ff; }
        }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--papel); color:var(--tinta);
               font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
        header { display:flex; justify-content:space-between; align-items:center;
                 padding:.75rem 1.25rem; border-bottom:1px solid var(--linea); gap:1rem; flex-wrap:wrap; }
        .marca { font-weight:700; text-decoration:none; color:var(--tinta); }
        header form { margin:0; }
        main { max-width:62rem; margin:0 auto; padding:1.5rem 1.25rem 4rem; display:block; }
        h1 { font-size:1.4rem; margin:0 0 1rem; letter-spacing:-.02em; }
        h2 { font-size:1.05rem; margin:1.75rem 0 .5rem; }
        table { width:100%; border-collapse:collapse; font-size:.9rem; }
        th, td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--linea); vertical-align:top; }
        th { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--tenue); }
        a { color:var(--acento); }
        .chips { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
        .chip { border:1px solid var(--linea); border-radius:999px; padding:.2rem .65rem;
                text-decoration:none; color:var(--tenue); font-size:.82rem; }
        .chip[aria-current="true"] { border-color:var(--acento); color:var(--acento); font-weight:600; }
        .estado { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
                  padding:.1rem .45rem; border-radius:4px; background:rgba(29,78,216,.12); color:var(--acento); }
        .estado.PUBLISHED { background:rgba(22,163,74,.15); color:#16a34a; }
        .estado.ARCHIVED  { background:rgba(180,83,9,.15); color:var(--aviso); }
        .estado.COMPLETADA { background:rgba(22,163,74,.15); color:#16a34a; }
        .estado.PARCIAL    { background:rgba(180,83,9,.15); color:var(--aviso); }
        .estado.FALLIDA    { background:rgba(185,28,28,.15); color:#b91c1c; }
        .estado.EN_CURSO   { background:rgba(29,78,216,.12); color:var(--acento); }
        .estado.DRAFT      { background:rgba(127,127,127,.14); color:var(--tenue); }
        .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));
                gap:.7rem; margin:.75rem 0 1rem; }
        .kpi { border:1px solid var(--linea); border-radius:8px; padding:.6rem .75rem;
               display:flex; flex-direction:column; gap:.15rem; }
        .kpi b { font-size:1.3rem; line-height:1.2; letter-spacing:-.02em; overflow-wrap:anywhere; }
        .kpi .meta { font-size:.78rem; }
        .acciones select { width:auto; min-width:14rem; }
        form.inline { display:inline; }
        input, select, textarea, button { font:inherit; }
        input[type=text], input[type=email], input[type=password], select, textarea {
            width:100%; padding:.55rem .7rem; border:1px solid var(--linea); border-radius:6px;
            background:var(--papel); color:var(--tinta); }
        textarea { min-height:9rem; resize:vertical; }
        td form.inline { display:inline-flex; gap:.5rem; align-items:center; }
        td form.inline select { width:auto; min-width:9rem; }
        button { padding:.5rem .9rem; border-radius:6px; cursor:pointer;
                 border:1px solid var(--acento); background:var(--acento); color:#fff; }
        button.peligro { border-color:#b91c1c; background:#b91c1c; }
        button.plano { background:transparent; color:var(--tinta); border-color:var(--linea); }
        :focus-visible { outline:3px solid var(--acento); outline-offset:2px; }
        .error { border-left:3px solid #b91c1c; background:rgba(185,28,28,.08);
                 padding:.6rem .8rem; margin-bottom:1rem; }
        .aviso { border-left:3px solid var(--aviso); background:rgba(180,83,9,.08);
                 padding:.6rem .8rem; margin:1rem 0; font-size:.9rem; }
        .estado.activa    { background:rgba(29,78,216,.12); color:var(--acento); }
        .estado.degradada { background:rgba(180,83,9,.15); color:var(--aviso); }
        .estado.apagada   { background:rgba(120,120,130,.15); color:var(--tenue); }
        td.url a { color:var(--tenue); font-size:.82rem; word-break:break-all; }
        form.alta { border-top:1px solid var(--linea); padding-top:1rem; margin-top:1.5rem;
                    display:flex; gap:.75rem; align-items:flex-end; flex-wrap:wrap; }
        form.alta label { margin:0; }
        form.alta input { min-width:16rem; }
        h2 { font-size:1rem; margin-top:2rem; }
        tr.fila-edicion { background:rgba(120,120,130,.05); }
        tr.fila-edicion td { padding:0 .5rem .6rem; }
        details summary { cursor:pointer; color:var(--tenue); font-size:.8rem; padding:.35rem 0; }
        .panel-fila { display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap; padding:.4rem 0; }
        button.peligro { border-color:#b91c1c; color:#b91c1c; }
        .tarjetas { display:flex; gap:.75rem; flex-wrap:wrap; margin:1.2rem 0; }
        .dato { border:1px solid var(--linea); border-radius:10px; padding:.8rem 1.1rem;
                min-width:8rem; }
        .dato .cifra { display:block; font-size:1.5rem; font-weight:700; line-height:1.15; }
        .dato .etiqueta { font-size:.75rem; color:var(--tenue); }
        .barra { background:var(--linea); border-radius:999px; height:8px; width:100%;
                 max-width:9rem; overflow:hidden; }
        .barra span { display:block; height:100%; background:var(--acento); }
        .grafico { display:flex; gap:4px; align-items:flex-end; height:90px; margin:1rem 0; }
        .columna { flex:1; display:flex; flex-direction:column; align-items:center;
                   justify-content:flex-end; height:100%; }
        .barra-v { width:100%; height:100%; display:flex; align-items:flex-end; }
        .barra-v span { display:block; width:100%; background:var(--acento);
                        border-radius:2px 2px 0 0; min-height:1px; }
        .columna small { font-size:.6rem; color:var(--tenue); }
        .campo { margin-bottom:.9rem; }
        label { display:block; font-size:.82rem; color:var(--tenue); margin-bottom:.25rem; }
        .meta { color:var(--tenue); font-size:.85rem; }
        .cuerpo { white-space:pre-wrap; background:rgba(127,127,127,.06); padding:1rem;
                  border-radius:6px; border:1px solid var(--linea); }
        .galeria { display:flex; gap:1rem; flex-wrap:wrap; }
        .galeria figure { margin:0; width:170px; }
        .galeria img { width:100%; height:auto; border-radius:6px; border:1px solid var(--linea); }
        .galeria figcaption { font-size:.78rem; margin-top:.3rem; display:flex; flex-direction:column; gap:.2rem; }
        .acciones { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
        form.lote { margin:0; }
        .lote__barra { display:flex; gap:.9rem; align-items:center; flex-wrap:wrap; margin:0 0 .75rem; }
        .lote__barra label { display:flex; gap:.4rem; align-items:center; margin:0;
                             font-size:.85rem; color:var(--tinta); }
        .lote__barra input[type=checkbox], table input[type=checkbox] { width:1rem; height:1rem; margin:0; }
        .resumen { border:1px solid var(--linea); border-radius:8px; padding:.8rem 1rem; margin:0 0 1.25rem; }
        .resumen p { margin:0; }
        .resumen summary { cursor:pointer; font-size:.88rem; margin-top:.5rem; }
        .resumen ul { margin:.3rem 0 0; padding-left:1.2rem; }
        .resumen li { font-size:.88rem; }
        table th:first-child, table td:first-child { width:1.6rem; }
    </style>
</head>
<body>
<header>
    <a class="marca" th:href="@{/admin}">Panel · Noticias Planeta</a>
    <nav class="chips" aria-label="Secciones del panel">
        <a class="chip" th:href="@{/admin}">Bandeja</a>
        <a class="chip" th:href="@{/admin/edicion}">Edición</a>
        <a class="chip" th:href="@{/admin/secciones}">Secciones</a>
        <a class="chip" th:href="@{/admin/fuentes}">Fuentes</a>
        <a class="chip" th:href="@{/admin/alertas}">Avisos</a>
        <a class="chip" th:href="@{/admin/metricas}">Métricas</a>
        <a class="chip" th:href="@{/admin/media}">Imágenes</a>
        <a class="chip" th:href="@{/admin/generador}">Generador</a>
        <a class="chip" th:href="@{/admin/autopublicacion}">Automática</a>
        <a class="chip" th:href="@{/admin/capacidades}">Capacidades IA</a>
    </nav>
    <form th:action="@{/admin/logout}" method="post" class="inline">
        <button type="submit" class="plano">Salir</button>
    </form>
</header>
<main th:replace="${contenido}"></main>
</body>
</html>
