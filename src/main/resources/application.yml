spring:
  application:
    name: noticiasplaneta
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noticias}
    username: ${DB_USER:noticias}
    password: ${DB_PASSWORD:noticias}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: noticiasplaneta
        version: 0.1.0
        protocol: STREAMABLE
        capabilities:
          tool: true
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}

management:
  endpoints:
    web:
      exposure:
        include: health,info

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    totp-secret: ${ADMIN_TOTP_SECRET:}

security:
  api-key: ${AGENT_API_KEY:}
  agent-id: ${AGENT_ID:newsroom-agent}
  rp-id: ${RP_ID:localhost}
  rp-name: Noticias Planeta
  allowed-origins:
    - ${RP_ORIGIN:https://localhost}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
  budget:
    daily-micros: ${AI_DAILY_BUDGET_MICROS:5000000}
  worker:
    delay-ms: 30000

langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  sample-rate: ${LANGFUSE_SAMPLE_RATE:1.0}
  service-name: ${LANGFUSE_SERVICE_NAME:noticiasplaneta}
  environment: ${LANGFUSE_ENVIRONMENT:production}
  max-payload-chars: ${LANGFUSE_MAX_PAYLOAD_CHARS:30000}

ingest:
  scheduler:
    enabled: true
    delay-ms: 900000

news:
  default-section: general
